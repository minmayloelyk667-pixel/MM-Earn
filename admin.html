<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MM Earn Admin</title><style>body{font-family:system-ui;margin:20px;max-width:800px}input,button{padding:12px;margin:6px 0}button{background:#6c35d5;color:white;border:0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h1>MM Earn Admin</h1><p>Admin password ကို server environment မှာ ADMIN_PASSWORD အဖြစ် သတ်မှတ်ထားရပါမယ်။</p><input id="pw" type="password" placeholder="Admin password"><button onclick="load()">တောင်းဆိုမှုများကြည့်ရန်</button><pre id="out"></pre><script>async function load(){let r=await fetch('/api/admin/withdrawals',{headers:{'x-admin-password':pw.value}});out.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
